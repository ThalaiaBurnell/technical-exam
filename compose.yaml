
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ARTICLES_FILE: /app/articles.json
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    environment:
      REDIS_HOST: redis
      MONGO_URI: mongodb://db:27017/
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  redis_data:
  mongo_data:
